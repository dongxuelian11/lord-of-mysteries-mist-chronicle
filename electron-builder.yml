appId: com.gmzz.mist-chronicle
productName: 灰雾纪事
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - electron/**
  - scripts/rag/lib/**
  - package.json
extraResources:
  - from: node_modules/vinext
    to: vinext
  - from: private/rag/index
    to: knowledge/seed
    filter:
      - index.meta.json
      - chunks.json
      - documents.json
      - inverted.json
      - alias-map.json
      - seed-manifest.json
asar: false
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
  executableName: MistChronicle
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 灰雾纪事
  artifactName: 灰雾纪事-Setup-${version}.${ext}
