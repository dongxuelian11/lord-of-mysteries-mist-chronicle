appId: com.gmzz.mist-chronicle
productName: 灰雾纪事
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - electron/**
  - shared/**
  - scripts/rag/lib/**
  - package.json
extraResources:
  - from: node_modules/vinext
    to: vinext
  - from: .runtime/release-seed
    to: knowledge/seed
asar: true
asarUnpack:
  # The production server and RAG worker run as child processes and therefore
  # need real filesystem paths. Everything else remains inside app.asar.
  - dist/**
  - electron/server.mjs
  - electron/rag-worker.mjs
  - scripts/rag/lib/**
win:
  # Keep the source icon in ICO form so electron-builder does not invoke its
  # CommonJS icon helper from the ESM project root under Node 22+.
  icon: build/icon.ico
  signAndEditExecutable: true
  verifyUpdateCodeSignature: true
  target:
    - target: nsis
      arch:
        - x64
  executableName: MistChronicle
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 灰雾纪事
  artifactName: 灰雾纪事-Setup-${version}.${ext}
